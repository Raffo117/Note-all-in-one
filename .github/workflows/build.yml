name: Build Note-all-in-one

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit, branch, or tag to build
        required: false
        default: main
        type: string
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record source revision
        run: |
          "Built source commit: $(git rev-parse HEAD)"
          $version = node -p "require('./package.json').version"
          "Package version: $version"
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke-test Windows installer and app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created." }
          $installDir = Join-Path $env:RUNNER_TEMP "Note-all-in-one-smoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }
          $app = Join-Path $installDir "Note-all-in-one.exe"
          if (-not (Test-Path $app)) { throw "Installed application executable was not found." }
          $profile = Join-Path $env:RUNNER_TEMP "Note-all-in-one-profile"
          $process = Start-Process -FilePath $app -ArgumentList @("--user-data-dir=$profile") -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Application exited during startup smoke test." }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Note-all-in-one-Windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record source revision
        run: |
          echo "Built source commit: $(git rev-parse HEAD)"
          echo "Package version: $(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Smoke-test Linux AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          app="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$app"
          chmod +x "$app"
          "$app" --appimage-extract >/dev/null
          cd squashfs-root
          set +e
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=5s 15s \
            ./AppRun --user-data-dir="$RUNNER_TEMP/Note-all-in-one-profile"
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "AppImage startup smoke test failed with exit code $status."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Note-all-in-one-Linux
          path: dist/*.AppImage
